name: btvn-ktpm

x-app: &app
  image: btvn-ktpm:local
  build: .
  environment: &environment
    SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and set SECRET_KEY}
    GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
    ALGORITHM: ${ALGORITHM:?Set ALGORITHM in .env}
    JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:?Set JWT_EXPIRE_MINUTES in .env}
    USER_SERVICE_URL: http://users:8001
    ORDER_SERVICE_URL: http://orders:8002
    UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:?Set UPSTREAM_TIMEOUT_SECONDS in .env}
    DATABASE_URL: sqlite+aiosqlite:////data/users.db
    ORDER_DATABASE_URL: sqlite+aiosqlite:////data/orders.db
    MINIO_ENDPOINT: minio:9000
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Set MINIO_PUBLIC_ENDPOINT in .env}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    MINIO_SECURE: ${MINIO_SECURE:?Set MINIO_SECURE in .env}
    MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
    MINIO_REGION: ${MINIO_REGION:?Set MINIO_REGION in .env}

services:
  users:
    <<: *app
    command: [uvicorn, src.services.users:app, --host, 0.0.0.0, --port, "8001", --no-proxy-headers]
    ports: ["127.0.0.1:8001:8001"]
    volumes: [users-data:/data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  orders:
    <<: *app
    command: [uvicorn, src.services.orders:app, --host, 0.0.0.0, --port, "8002", --no-proxy-headers]
    ports: ["127.0.0.1:8002:8002"]
    volumes: [orders-data:/data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  gateway:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      users: {condition: service_healthy}
      orders: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    image: btvn-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]

volumes:
  users-data:
  orders-data:
  minio-data:
